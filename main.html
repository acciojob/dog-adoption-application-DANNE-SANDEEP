<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Adoption Application</title>
</head>
<body>

    <form>
        <!-- Name -->
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Name">
        <br><br>

        <!-- Phone Number -->
        <label for="phone">Phone Number:</label>
        <input type="text" id="phone" placeholder="Phone Number">
        <br><br>

        <!-- Address -->
        <label for="address">Address:</label>
        <input type="text" id="address" placeholder="Address">
        <br><br>

        <!-- Checkbox -->
        <input
            type="checkbox"
            id="checkbox"
            value="Have you ever lived with a Dog before?"
        >
        <label for="checkbox">Have you ever lived with a Dog before?</label>
        <br><br>

        <!-- Multi-select -->
        <label for="multiSelect">Please select your preferred breeds:</label><br>
        <select id="multiSelect" multiple>
            <option>Labrador Retriever</option>
            <option>Golden Retriever</option>
            <option>German Shepherd</option>
            <option>Beagle</option>
        </select>
        <br><br>

        <!-- Submit -->
        <input type="submit" id="submit" value="Submit">

    </form>

</body>
</html>
